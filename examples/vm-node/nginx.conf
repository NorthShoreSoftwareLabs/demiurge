# Example nginx reverse proxy configuration for Demiurge VM Node
# This demonstrates a typical setup where nginx:
# 1. Terminates TLS with real certificates (certificate paths are placeholders)
# 2. Forwards requests to the loopback Node process
# 3. Adds X-Forwarded-* headers so the app reads the real client IP and protocol

# Upstream points to the loopback-bound Node process
upstream demiurge_vm_node {
  server 127.0.0.1:4173;
  keepalive 32;
}

# HTTP server: redirect to HTTPS
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}

# HTTPS server: reverse proxy to the Node process
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name example.com;

  # TLS certificate paths (replace with real certificate locations in production)
  ssl_certificate /etc/nginx/ssl/cert.pem;
  ssl_certificate_key /etc/nginx/ssl/key.pem;

  # Typical TLS configuration
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # Proxy settings
  location / {
    # Forward the request to the loopback Node process
    proxy_pass http://demiurge_vm_node;

    # Keep the connection alive for efficiency
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Headers the Node process needs to read the real client
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Health check endpoint (systemd or orchestration can probe this)
  location /.well-known/ready {
    proxy_pass http://demiurge_vm_node;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    access_log off;
  }
}
