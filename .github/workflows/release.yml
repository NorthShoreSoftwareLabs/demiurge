name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify signed release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      package-name: ${{ steps.version.outputs.package-name }}
      package-version: ${{ steps.version.outputs.package-version }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate version and dist-tag
        id: version
        run: |
          package_name=$(node -p 'require("./packages/core/package.json").name')
          package_version=$(node -p 'require("./packages/core/package.json").version')
          scaffold_version=$(node -p 'require("./packages/create-demiurge/package.json").version')
          test "$GITHUB_REF_NAME" = "v$package_version"
          test "$scaffold_version" = "$package_version"
          dist_tag=latest
          case "$package_version" in
            *-*) dist_tag=next ;;
          esac
          echo "package-name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Require a verified annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
          object_type=${tag_object%% *}
          object_sha=${tag_object##* }
          test "$object_type" = tag
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.verification.verified')" = true

      - name: Require a closed milestone for this version
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          release_version=${PACKAGE_VERSION%%-*}
          milestone=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" --jq "[.[] | select(.title | startswith(\"$release_version\"))] | .[0].title // \"\"")
          if [ -z "$milestone" ]; then
            echo "No milestone starts with $release_version." >&2
            exit 1
          fi
          open_p1=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label p1 --milestone "$milestone" --limit 100 --json number --jq length)
          test "$open_p1" = 0

      - name: Refuse an unrelated npm package owner
        env:
          EXPECTED_NPM_OWNER: john_nssl
          PACKAGE_NAME: ${{ steps.version.outputs.package-name }}
        run: |
          if repository=$(npm view "$PACKAGE_NAME" repository.url --json 2>/dev/null); then
            case "$repository" in
              ""|null)
                owners=$(npm owner ls "$PACKAGE_NAME")
                case "$owners" in
                  *"$EXPECTED_NPM_OWNER"*) ;;
                  *) echo "npm package $PACKAGE_NAME does not list the expected owner." >&2; exit 1 ;;
                esac
                ;;
              *NorthShoreSoftwareLabs/demiurge*) ;;
              *) echo "npm package $PACKAGE_NAME belongs to another repository: $repository" >&2; exit 1 ;;
            esac
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Redis
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Run clean-checkout verification
        run: pnpm verify

      # This step runs after verification. It therefore also proves that no
      # verification step changed a tracked file in the release checkout.
      - name: Validate release metadata
        run: pnpm release:check -- "$GITHUB_REF_NAME"

  publish:
    name: Publish with provenance
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node for npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish package
        run: npm publish ./packages/core --access public --provenance --tag "${{ needs.verify.outputs.dist-tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "Demiurge ${{ needs.verify.outputs.package-version }}" --verify-tag

  # The scaffold publishes from the same tag at the same version. It runs after
  # the framework release so a scaffold registry failure cannot withhold the
  # framework artifact or the GitHub release. Rerun this job alone to recover.
  publish-scaffold:
    name: Publish the scaffold
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node for npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse an unrelated npm package owner
        env:
          EXPECTED_NPM_OWNER: john_nssl
        run: |
          if repository=$(npm view create-demiurge repository.url --json 2>/dev/null); then
            case "$repository" in
              ""|null)
                owners=$(npm owner ls create-demiurge)
                case "$owners" in
                  *"$EXPECTED_NPM_OWNER"*) ;;
                  *) echo "npm package create-demiurge does not list the expected owner." >&2; exit 1 ;;
                esac
                ;;
              *NorthShoreSoftwareLabs/demiurge*) ;;
              *) echo "npm package create-demiurge belongs to another repository: $repository" >&2; exit 1 ;;
            esac
          fi

      - name: Publish the scaffold
        run: npm publish ./packages/create-demiurge --access public --provenance --tag "${{ needs.verify.outputs.dist-tag }}"
